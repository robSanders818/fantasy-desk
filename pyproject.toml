[project]
name = "fantasy-desk"
version = "0.1.0"
description = "Daily fantasy recommendations (lineups, adds, win% added), published as an encrypted page"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "cryptography>=44",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pandas>=3.0.6",
    "numpy>=2",
    "scipy>=1.18.1",
]

[dependency-groups]
local = [
    "browser-cookie3>=0.20",
]
